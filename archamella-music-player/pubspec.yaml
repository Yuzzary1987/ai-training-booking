name: archamella_music_player
description: Winamp-style MP3 player for Android by Archamella.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  marquee: ^2.3.0
  shared_preferences: ^2.2.3

flutter:
  uses-material-design: true
